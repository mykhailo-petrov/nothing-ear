<form class="feedback-form" novalidate>
	<div class="feedback-form__fields">
		<div class="form-container">
			<input
				class="form-container__input"
				type="text"
				name="name"
				id="feedback-name"
				placeholder="Nome"
				aria-label="Nome"
				autocomplete="name"
				required
			/>
		</div>
		<div class="form-container">
			<input
				class="form-container__input"
				type="email"
				name="email"
				id="feedback-email"
				placeholder="E-mail"
				aria-label="E-mail"
				autocomplete="email"
				required
			/>
		</div>
		<div class="form-container">
			<textarea
				class="form-container__textarea"
				name="message"
				id="feedback-message"
				rows="4"
				placeholder="Mensagem"
				aria-label="Mensagem"
			></textarea>
		</div>
	</div>
	<label class="feedback-form__privacy checkbox-label" for="feedback-privacy">
		<input
			class="checkbox"
			type="checkbox"
			name="privacy"
			id="feedback-privacy"
			value="1"
			required
		/>
		<span class="checkbox-label__text"
			>Concordo com a <a href="#" class="feedback-form__link">Política de Privacidade</a>.</span
		>
	</label>
	<button type="submit" class="feedback-form__button button button--l button--primary button--fw">
		Enviar mensagem →
	</button>
	<p class="feedback-form__status" aria-live="polite" hidden></p>
</form>
